general:
  complete_verifier: bab
  device: cuda

model:
  name: mnist_6_100
  path: models/eran/mnist_6_100_nat.pth

data:
  dataset: MNIST_ERAN_UN
  std: [1.0]
  mean: [0.0]

specification:
  epsilon: 0.026

attack:
  pgd_order: skip

solver:
  batch_size: 256
  beta-crown:
    iteration: 20

bab:
  timeout: 300
  branching:
    method: kfsb
    reduceop: max
    candidates: 3
